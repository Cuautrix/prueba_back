spring:
  application:
    name: financial_system

  # Configuración CORS para permitir TODOS los dominios
  web:
    cors:
      allowed-origins: "*"       # Permite cualquier origen (sin restricciones)
      allowed-methods: "*"       # GET, POST, PUT, DELETE, etc.
      allowed-headers: "*"       # Headers permitidos (incluyendo Authorization, Content-Type, etc.)
      allow-credentials: true    # Permite cookies y autenticación (necesario para JWT)
      max-age: 3600             # Cache de preflight requests (1 hora)

  # Resto de tu configuración existente...
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${POSTGRES_DB}?client_encoding=LATIN1
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
          quitwait: false
    servlet:
      multipart:
        max-file-size: 20MB
        max-request-size: 20MB

  flyway:
    enabled: true
    locations: classpath:db/migrations
    baseline-on-migrate: true

vendors:
  ocr:
    url: https://devapicamarket.com:8243/ocr/V1
  apiMarket:
    token: ${APIMARKET_TOKEN}
    renapo:
      basic-url: https://apimarket.mx/api/renapo
      validar-curp: https://apimarket.mx/api/renapo/grupo/valida-curp
    sat:
      basic-url: https://apimarket.mx/api/sat
      obtener-rfc: https://apimarket.mx/api/sat/grupo/obtener-rfc
      datos-fiscales: https://apimarket.mx/api/sat/grupo/validar-datos
      lista-negra-69b: https://apimarket.mx/api/sat/v2/lista69b

financial_system:
  ws:
    webhook: https://localhost:0408/uat/wss-clients/webhook/receive/
    endpoint: http://localhost:4200/#/auth/validar-cliente
    password-recovery-endpoint: http://localhost:4200/#/auth/cambiar-contraseña

  domain: prueba-front-sandy.vercel.app
  allowedDomain: https://prueba-front-sandy.vercel.app/

logging:
  level:
    org:
      flywaydb: debug

security:
  jwt:
    accessTokenCookieName: SESSIONID